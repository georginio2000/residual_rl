experiment:
  name: toy_frozen
  mode: frozen
  seed: 0
  device: cpu
  output_dir: runs/toy_frozen

environment:
  backend: precision_reach
  max_episode_steps: 60
  step_scale: 0.10
  success_tolerance: 0.035
  success_bonus: 5.0
  action_penalty: 0.01
  process_noise_std: 0.0

base_policy:
  backend: proportional
  gain: 5.0
  bias: [0.18, -0.12]

representation:
  backend: identity

agent:
  hidden_dims: [128, 128]
  residual_scale: 0.35
  gamma: 0.99
  tau: 0.005
  learning_rate: 0.0003
  alpha: 0.2
  automatic_entropy_tuning: true

training:
  total_steps: 0
  replay_capacity: 100000
  batch_size: 256
  start_steps: 1000
  updates_per_step: 1
  evaluation_interval: 5000
  evaluation_episodes: 100
  checkpoint_interval: 10000
  lambda_delta: 0.0
  lambda_gate: 0.0
