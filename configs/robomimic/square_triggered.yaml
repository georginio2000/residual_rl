experiment:
  name: robomimic_square_triggered
  mode: triggered
  seed: 0
  device: cpu
  output_dir: runs/robomimic_square_triggered

environment:
  backend: remote_robomimic
  options:
    endpoint: http://127.0.0.1:8766
    observation_dim: 23
    action_dim: 7
    action_low: -2.0
    action_high: 2.0
    action_dtype: float64
    task_context_dim: 1
    timeout: 120.0

base_policy:
  backend: observation_action
  options:
    key: base_action

representation:
  backend: observation_keys
  options:
    feature_dims:
      observation/state: 23
      task_context: 1

agent:
  hidden_dims: [256, 256]
  residual_scale: 0.05
  gamma: 0.99
  tau: 0.005
  learning_rate: 0.0003
  alpha: 0.1
  automatic_entropy_tuning: false

training:
  total_steps: 50000
  replay_capacity: 200000
  batch_size: 256
  start_steps: 2000
  updates_per_step: 1
  evaluation_interval: 0
  evaluation_episodes: 20
  checkpoint_interval: 10000
  lambda_delta: 0.05
  lambda_gate: 0.0
