[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "last-millimeter-rl"
version = "0.1.0"
description = "Residual reinforcement learning for specializing frozen robot policies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "torch>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
last-mm-train = "last_millimeter.train:main"
last-mm-eval = "last_millimeter.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

